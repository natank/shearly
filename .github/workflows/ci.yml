name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: gates 1–8
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: shearly
          POSTGRES_PASSWORD: shearly
          POSTGRES_DB: shearly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shearly -d shearly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      DATABASE_URL: postgres://shearly:shearly@localhost:5432/shearly
      GEOCODER_URL: http://127.0.0.1:3001
      SMTP_URL: smtp://127.0.0.1:1025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 1. Setup
        run: pnpm install --frozen-lockfile

      - name: Derive Nx SHAs
        uses: nrwl/nx-set-shas@v4

      - name: 2. Lint and format
        run: |
          pnpm format:check
          pnpm exec nx affected -t lint
          pnpm check:i18n
          pnpm check:rtl

      - name: 3. Typecheck
        run: pnpm exec nx run-many -t typecheck --exclude=web-e2e

      - name: 4. Unit tests
        run: pnpm exec nx affected -t test --exclude=integration,web-e2e

      - name: 5. Integration
        run: |
          pnpm exec nx run api:migrate
          pnpm exec nx test integration

      - name: 6. Build
        run: pnpm exec nx run-many -t build -p web,admin,api

      - name: 7. E2E both locales
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec nx e2e web-e2e

      - name: 8. Secret scan
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact --verbose

      - name: 8. Dependency audit
        run: |
          pnpm audit --prod || true
          pnpm audit --prod --audit-level=critical
